[package]
name = "ccx-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
crossterm = "0.29.0"
glam = "0.30.9"
itertools = "0.14.0"
nalgebra = "0.34.1"
ratatui = "0.30.0"
rayon = "1.11.0"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.17"

[lints.rust]
unused = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
collapsible_if = "allow"
